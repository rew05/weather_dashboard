<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天気ダッシュボード | 3日間予報</title>
  <meta name="description" content="今日から3日間の天気、気温、湿度をリアルタイムで確認できる天気ダッシュボード" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="app-icon">🌤️</div>
        <div>
          <h1 class="app-title">てんきダッシュボード</h1>
          <p class="app-subtitle" id="last-updated">データしゅとくちゅう...</p>
        </div>
      </div>
      <div class="header-right">
        <div class="location-badge" id="location-name">
          <span class="location-icon">📍</span>
          <span id="location-text">位置情報取得中...</span>
        </div>
        <button class="refresh-btn" id="refresh-btn" onclick="loadWeather()" title="更新">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Loading State -->
    <div class="loading-state" id="loading-state">
      <div class="spinner"></div>
      <p>天気データを取得しています...</p>
    </div>

    <!-- Error State -->
    <div class="error-state hidden" id="error-state">
      <div class="error-icon">⚠️</div>
      <h2>データの取得に失敗しました</h2>
      <p id="error-message">位置情報へのアクセスを許可してください</p>
      <button class="retry-btn" onclick="loadWeather()">再試行</button>
    </div>

    <!-- Main Content -->
    <main class="main-content hidden" id="main-content">

      <!-- Today's Hero Card -->
      <section class="today-section">
        <div class="today-card" id="today-card">
          <div class="today-card-bg"></div>
          <div class="today-left">
            <div class="today-label">きょう</div>
            <div class="today-date" id="today-date">--</div>
            <div class="today-weather-icon" id="today-icon">🌤️</div>
            <div class="today-desc" id="today-desc">--</div>
          </div>
          <div class="today-right">
            <div class="today-temp-main">
              <span class="today-temp-value" id="today-temp">--</span>
              <span class="today-temp-unit">°C</span>
            </div>
            <div class="today-temp-range">
              <span class="temp-hi">↑<span id="today-max">--</span>°</span>
              <span class="temp-lo">↓<span id="today-min">--</span>°</span>
            </div>
            <div class="today-metrics">
              <div class="metric-chip" id="chip-humidity">
                <span class="metric-chip-icon">💧</span>
                <div>
                  <div class="metric-chip-label">しめっぽさ</div>
                  <div class="metric-chip-value"><span id="today-humidity">--</span>%</div>
                </div>
              </div>
              <div class="metric-chip" id="chip-wind">
                <span class="metric-chip-icon">💨</span>
                <div>
                  <div class="metric-chip-label">かぜのはやさ</div>
                  <div class="metric-chip-value"><span id="today-wind">--</span> m/s</div>
                </div>
              </div>
              <div class="metric-chip" id="chip-rain">
                <span class="metric-chip-icon">🌧️</span>
                <div>
                  <div class="metric-chip-label">あめのふるりょう</div>
                  <div class="metric-chip-value"><span id="today-rain">--</span> mm</div>
                </div>
              </div>
              <div class="metric-chip" id="chip-uv">
                <span class="metric-chip-icon">☀️</span>
                <div>
                  <div class="metric-chip-label">たいようのつよさ</div>
                  <div class="metric-chip-value"><span id="today-uv">--</span></div>
                </div>
              </div>
            </div>

            <div class="wardrobe-panel" id="wardrobe-panel">
              <div class="wardrobe-item">
                <div class="wardrobe-icon" id="wardrobe-top-icon">👕</div>
                <div class="wardrobe-label">うえ</div>
                <div class="wardrobe-value" id="wardrobe-top-text">--</div>
              </div>
              <div class="wardrobe-item">
                <div class="wardrobe-icon" id="wardrobe-bottom-icon">👖</div>
                <div class="wardrobe-label">した</div>
                <div class="wardrobe-value" id="wardrobe-bottom-text">--</div>
              </div>
              <div class="wardrobe-item">
                <div class="wardrobe-icon" id="wardrobe-outer-icon">🧥</div>
                <div class="wardrobe-label">うわぎ</div>
                <div class="wardrobe-value" id="wardrobe-outer-text">--</div>
              </div>
              <div class="wardrobe-item">
                <div class="wardrobe-icon" id="wardrobe-rain-icon">☔</div>
                <div class="wardrobe-label">あまぐ</div>
                <div class="wardrobe-value" id="wardrobe-rain-text">--</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Hourly Forecast -->
      <section class="section">
        <h2 class="section-title">⏰ きょうのじかんべつよほう</h2>
        <div class="hourly-scroll" id="hourly-scroll">
          <!-- populated by JS -->
        </div>
      </section>

      <!-- 3-Day Forecast -->
      <section class="section">
        <h2 class="section-title">📅 3にちかんのよほう</h2>
        <div class="forecast-grid" id="forecast-grid">
          <!-- populated by JS -->
        </div>
      </section>

      <!-- Humidity Detail Chart -->
      <section class="section">
        <h2 class="section-title">💧 しつどのすいい（きょう）</h2>
        <div class="humidity-chart-card">
          <div class="humidity-bars" id="humidity-bars">
            <!-- populated by JS -->
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
